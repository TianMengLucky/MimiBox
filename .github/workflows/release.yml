name: release

# 双产品线发布约定（与 plugin-architecture 分支的 workflow 保持一致）：
# - `vX.Y.Z`   → 主分支（main）：构建 mimibox，发布到 tag 对应的 Release，
#                更新源走 releases/latest/download/latest.json
# - `vX.Y.Z-x` → 插件化分支（plugin-architecture）：构建 MimiBox-X，
#                发布到固定 tag `x-latest` 的 prerelease Release，
#                更新源走 releases/download/x-latest/latest.json
#
# 本文件只负责主产品线：`-x` 结尾的 tag 一律快速失败，
# 插件产品线（含插件打包 / Lite 版构建）由 plugin-architecture
# 分支上的 workflow 负责，两者互不干扰。

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `-x` tag 属于插件产品线，应指向 plugin-architecture 分支的提交；
      # 若误打到 main 提交上，这里立即失败，避免把主产品线产物发错线
      - name: Reject plugin-line tags
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-x ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} 属于插件产品线（MimiBox-X），请从 plugin-architecture 分支打 tag 发布"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            { sub(/\r$/, "") }
            BEGIN { head = "## [" ver "]" }
            !found && index($0, head) == 1 { found = 1; next }
            found && (substr($0, 1, 3) == "## " || substr($0, 1, 1) == "[") { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          sed -i -e '/./,$!d' release_notes.md
          printf '%s\n' "$(cat release_notes.md)" > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No section '## [$VERSION]' found in CHANGELOG.md" >&2
            exit 1
          fi
          {
            echo 'body<<NOTES_EOF'
            cat release_notes.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          cat release_notes.md

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MimiBox ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
