name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            { sub(/\r$/, "") }
            BEGIN { head = "## [" ver "]" }
            !found && index($0, head) == 1 { found = 1; next }
            found && (substr($0, 1, 3) == "## " || substr($0, 1, 1) == "[") { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          sed -i -e '/./,$!d' release_notes.md
          printf '%s\n' "$(cat release_notes.md)" > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No section '## [$VERSION]' found in CHANGELOG.md" >&2
            exit 1
          fi
          {
            echo 'body<<NOTES_EOF'
            cat release_notes.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          cat release_notes.md

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MimiBox ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
