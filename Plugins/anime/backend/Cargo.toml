[package]
name = "mimibox-plugin-anime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "番剧插件后端：Bangumi 每日放送时间表"

[lib]
crate-type = ["cdylib"]

[dependencies]
mimibox-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "rustls-tls-webpki-roots"] }
