[package]
name = "mimibox-plugin-bilibili-comments"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "B 站评论区插件后端：视频列表、评论拉取、标记与本地备注"

[lib]
crate-type = ["cdylib"]

[dependencies]
mimibox-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }
md-5 = "0.10"
hex = "0.4"
rand = "0.9"
