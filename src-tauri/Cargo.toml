[package]
name = "mimibox"
version = "0.1.0"
description = "A Tauri App"
license = "GPL-3.0-only"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mimibox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bpi-rs = "0.3.0"
wreq = { version = "0.15.3", features = ["cookies", "cookies-preserve-order", "json", "gzip", "brotli"] }
wreq-util = "0.1"
tokio = { version = "1", features = ["time"] }
qrcode = "0.14.1"
image = "0.25.10"
base64 = "0.23.1"
rand = "0.9"
rand_core = "0.6"
sha2 = "0.11"
# 抖音 web 安全栈：QuickJS 承载官方 bdms/dtrait JS，RSA/AES/ECDH/DEFLATE 为其提供原生绑定
rquickjs = { version = "0.13", features = ["futures"] }
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdh"] }
flate2 = "1"
hex = "0.4"
url = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 开发构建:增量编译 + 较多 codegen-units 以缩短单次编译时间
[profile.dev]
incremental = true
codegen-units = 16
debug = 1  # 仅行号,无完整 debug info,首次编译显著更快

# 依赖以 release 模式编译一次后缓存,后续 dev 改动只重编本项目代码
# (clean build 略慢,但增量编译极快)
[profile.dev.package."*"]
opt-level = 3
codegen-units = 16

