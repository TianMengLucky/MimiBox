[package]
name = "mimibox"
version = "0.2.2"
description = "A Tauri App"
license = "GPL-3.0-only"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mimibox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bpi-rs = "0.3.0"
reqwest = { version = "0.12", features = ["cookies", "json", "gzip", "brotli"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
# 插件化运行时：cordis 生命周期/服务依赖 + 插件 SDK + dll 动态加载
mimibox-plugin = { workspace = true }
cordis-rs = "0.8"
libloading = "0.8"
qrcode = "0.14.1"
image = "0.25.10"
base64 = "0.23.1"
rand = "0.9"
rand_core = "0.6"
sha2 = "0.11"
# B 站评论区 WBI 参数签名（w_rid = MD5(查询串 + mixin key)）
md-5 = "0.10"
# 抖音 web 安全栈：QuickJS 承载官方 bdms/dtrait JS，RSA/AES/ECDH/DEFLATE 为其提供原生绑定
rquickjs = { version = "0.13", features = ["futures"] }
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdh"] }
flate2 = "1"
hex = "0.4"
url = "2"
# 方案导入导出（.miz）：应用专属 zip 方案包，仅 deflate 压缩
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
brotli = "9.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

# 注意：release/dev profile 已上移到 workspace 根 Cargo.toml 统一管理

